{% extends "base.html" %}{% block content %}<h2>Staff management</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col"><input class="form-control" name="name" placeholder="Name" required></div><div class="col"><input class="form-control" name="email" type="email" placeholder="Email" required></div><div class="col"><input class="form-control" name="password" type="password" placeholder="Strong password" required></div><div class="col"><button class="btn btn-primary">Add staff</button></div></form></div>{% for u in users %}<div class="border rounded p-2 mb-2">{{ u.name }} · {{ u.email }}</div>{% endfor %}{% endblock %}
