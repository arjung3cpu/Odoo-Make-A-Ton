{% extends "base.html" %}{% block content %}<h2>Quotation templates</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-4"><input class="form-control" name="name" placeholder="Template name" required></div><div class="col-md-4"><select class="form-select" name="plan_id" required><option value="">Choose plan</option>{% for p in plans %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="validity_days" type="number" min="1" value="14"></div><div class="col-md-2"><button class="btn btn-primary">Save template</button></div></form></div>{% for q in quotes %}<div class="border rounded p-2 mb-2">{{ q.name }} · Plan #{{ q.plan_id }} · Valid {{ q.validity_days }} days</div>{% endfor %}{% endblock %}
