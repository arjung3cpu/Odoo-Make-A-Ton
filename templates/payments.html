{% extends "base.html" %}{% block content %}<h2>Payments</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-4"><select class="form-select" name="invoice_id" required><option value="">Select invoice</option>{% for i in invoices %}<option value="{{ i.id }}">{{ i.invoice_number }} · ₹{{ i.total }} · Balance ₹{{ i.total-paid_amount(i.id) }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="amount" type="number" min=".01" step=".01" placeholder="Amount" required></div><div class="col-md-2"><select class="form-select" name="method"><option>UPI</option><option>Card</option><option>Bank transfer</option><option>Cash</option><option>Other</option></select></div><div class="col-md-2"><input class="form-control" name="note" placeholder="Note"></div><div class="col-md-2"><button class="btn btn-primary">Record payment</button></div></form></div><div class="card p-3"><table class="table"><tr><th>Invoice ID</th><th>Amount</th><th>Method</th><th>Date</th><th>Note</th></tr>{% for p in payments %}<tr><td>#{{ p.invoice_id }}</td><td>₹{{ p.amount }}</td><td>{{ p.method }}</td><td>{{ p.payment_date }}</td><td>{{ p.note }}</td></tr>{% endfor %}</table></div>{% endblock %}
