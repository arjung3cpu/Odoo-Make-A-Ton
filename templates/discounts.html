{% extends "base.html" %}{% block content %}<h2>Discount rules</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-3"><input class="form-control" name="name" placeholder="Discount name" required></div><div class="col-md-2"><select class="form-select" name="discount_type"><option value="percentage">Percentage</option><option value="fixed">Fixed amount</option></select></div><div class="col-md-2"><input class="form-control" name="value" type="number" step=".01" placeholder="Value" required></div><div class="col-md-2"><input class="form-control" name="min_quantity" type="number" min="1" value="1"></div><div class="col-md-2"><select class="form-select" name="product_id"><option value="">All products</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="start_date" type="date"></div><div class="col-md-2"><input class="form-control" name="end_date" type="date"></div><div class="col-md-2"><input class="form-control" name="usage_limit" type="number" placeholder="Usage limit"></div><div class="col-md-2"><button class="btn btn-primary">Create discount</button></div></form></div><div class="card p-3"><table class="table"><tr><th>Name</th><th>Type</th><th>Value</th><th>Uses</th><th>Validity</th></tr>{% for d in discounts %}<tr><td>{{ d.name }}</td><td>{{ d.discount_type }}</td><td>{{ d.value }}</td><td>{{ d.times_used }}/{{ d.usage_limit or '∞' }}</td><td>{{ d.start_date or 'Any' }} – {{ d.end_date or 'Any' }}</td></tr>{% endfor %}</table></div>{% endblock %}
