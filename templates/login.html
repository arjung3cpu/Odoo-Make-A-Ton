{% extends "base.html" %}{% block content %}
<div class="auth-wrap"><div class="card shadow-lg p-4 auth-card"><h2 class="fw-bold">Welcome to Subscript</h2><p class="text-muted">Subscription management, made simple.</p>
{% if signup %}<form method="post" action="{{ url_for('register') }}"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Create customer account</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
{% else %}<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form><div class="d-flex justify-content-between mt-3"><a href="{{ url_for('register') }}">Create customer account</a><a href="{{ url_for('forgot_password') }}">Forgot password?</a></div>{% endif %}
<hr><small class="text-muted">Demo admin: admin@subscript.local / Admin@12345</small></div></div>{% endblock %}
