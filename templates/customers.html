{% extends "base.html" %}{% block content %}<h2>Customers</h2><div class="card p-3 mb-4"><form method="post" class="row g-2"><div class="col-md-3"><input class="form-control" name="name" placeholder="Customer name" required></div><div class="col-md-3"><input class="form-control" name="email" type="email" placeholder="Email" required></div><div class="col-md-2"><input class="form-control" name="company" placeholder="Company"></div><div class="col-md-2"><input class="form-control" name="phone" placeholder="Phone"></div><div class="col-md-2"><button class="btn btn-primary w-100">Add customer</button></div></form></div><div class="card p-3"><table class="table"><tr><th>Name</th><th>Email</th><th>Company</th><th>Phone</th></tr>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.email }}</td><td>{{ c.company }}</td><td>{{ c.phone }}</td></tr>{% endfor %}</table></div>{% endblock %}
