{% extends "base.html" %}{% block content %}<h2>Plans</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-3"><select class="form-select" name="product_id" required><option value="">Product</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="name" placeholder="Plan name" required></div><div class="col-md-2"><input class="form-control" name="price" type="number" step=".01" placeholder="Price" required></div><div class="col-md-2"><select class="form-select" name="frequency">{% for f in ['daily','weekly','monthly','yearly'] %}<option>{{ f }}</option>{% endfor %}</select></div><div class="col-md-1"><input class="form-control" name="min_quantity" type="number" min="1" value="1"></div><div class="col-md-2"><input class="form-control" name="tax_rate" type="number" step=".01" placeholder="Tax %"></div><div class="col-md-3"><input class="form-control" name="available_from" type="date" title="Available from"></div><div class="col-md-3"><input class="form-control" name="available_until" type="date" title="Available until"></div><div class="col-md-4 form-check"><input class="form-check-input" type="checkbox" name="allow_pause" checked><label class="form-check-label">Allow pause</label> <input class="form-check-input ms-3" type="checkbox" name="allow_early_close" checked><label class="form-check-label">Early close</label> <input class="form-check-input ms-3" type="checkbox" name="allow_renewal" checked><label class="form-check-label">Renewal</label></div><div class="col-md-2"><button class="btn btn-primary">Create plan</button></div></form></div><div class="card p-3"><table class="table"><tr><th>Plan</th><th>Product</th><th>Price</th><th>Frequency</th><th>Tax</th></tr>{% for p in plans %}<tr><td>{{ p.name }}</td><td>{{ p.product_id }}</td><td>₹{{ p.price }}</td><td>{{ p.frequency }}</td><td>{{ p.tax_rate }}%</td></tr>{% endfor %}</table></div>{% endblock %}
