{% extends "base.html" %}{% block content %}<h2>Products</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-3"><input class="form-control" name="name" placeholder="Product name" required></div><div class="col-md-2"><input class="form-control" name="product_type" placeholder="Type"></div><div class="col-md-2"><input class="form-control" name="sales_price" type="number" step=".01" placeholder="Sales price" required></div><div class="col-md-2"><input class="form-control" name="cost_price" type="number" step=".01" placeholder="Cost price"></div><div class="col-md-3"><input class="form-control" name="notes" placeholder="Notes"></div><div class="col-md-4"><input class="form-control" name="variant_name" placeholder="Optional variant name"></div><div class="col-md-3"><input class="form-control" name="variant_price" type="number" step=".01" placeholder="Variant extra price"></div><div class="col-md-2"><button class="btn btn-primary">Add product</button></div></form></div><div class="card p-3"><table class="table"><tr><th>Name</th><th>Type</th><th>Sales price</th><th>Cost</th></tr>{% for p in products %}<tr><td>{{ p.name }}</td><td>{{ p.product_type }}</td><td>₹{{ p.sales_price }}</td><td>₹{{ p.cost_price }}</td></tr>{% endfor %}</table></div>{% endblock %}
